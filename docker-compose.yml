version: '3.9'

# Honest Voice 開発環境用 Docker Compose
# 使用方法: docker-compose up
# または: docker-compose up --build

services:
  app:
    build:
      context: .
      target: development
    container_name: honest-voice-dev
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/rails
      - /rails/node_modules
      - /rails/vendor/bundle
      - /rails/tmp
    ports:
      - "3000:3000"
      - "5173:5173"
    environment:
      RAILS_ENV: development
      RAILS_LOG_TO_STDOUT: "true"
      NODE_ENV: development
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/honest_voice_development"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: honest_voice_development
    command: bash -c "bundle exec rails db:create db:migrate 2>/dev/null || true && npm run css:build && npm run build && (npm run css:watch &) && (npm run dev &) && bundle exec rails server -b 0.0.0.0"
    stdin_open: true
    tty: true

  db:
    image: postgres:15-alpine
    container_name: honest-voice-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: honest_voice_development
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
    driver: local



