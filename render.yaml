services:
  - type: web
    name: honest-voice
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: bundle exec puma -b tcp://0.0.0.0:3000
    region: oregon
    plan: free
    healthCheckPath: /
    envVars:
      - key: RAILS_ENV
        value: production
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: honest-voice-db
          property: connectionString
      - key: RAILS_LOG_TO_STDOUT
        value: "1"
      - key: RAILS_SERVE_STATIC_FILES
        value: "1"

databases:
  - name: honest-voice-db
    region: oregon
    plan: free
